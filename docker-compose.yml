# Un solo servicio: la API con SQLite local (sin PostgreSQL ni Redis).
# Los secretos van en backend/.env (env_file); aquí NO se declara ninguna clave: una variable vacía en `environment:`
# tendría precedencia sobre el archivo y borraría la real (p. ej. IDOO_API_KEY).
# NODE_ENV=production exige DATA_ENCRYPTION_KEY y MAIL_MODE=smtp (ver .env.example). Para una demo local usa `npm run start:backend`.
services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_PATH: /app/data/enruta.sqlite
      STORAGE_DIR: /app/storage
    ports: ["3000:3000"]
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
    restart: unless-stopped
