<div class="form-heading"><span class="eyebrow">BIENVENIDO</span><h2>Inicia sesión</h2><p>Usa tu correo de empresa para continuar.</p></div>
            <form (ngSubmit)="app.login()">
              <label>Correo electrónico<input type="email" name="loginEmail" [(ngModel)]="app.email" placeholder="nombre@empresa.com" autocomplete="username" required></label>
              <label>Contraseña<input type="password" name="loginPassword" [(ngModel)]="app.password" placeholder="Escribe tu contraseña" autocomplete="current-password" required></label>
              @if (app.network.state().demoHint) {
                <div class="demo-credentials">
                  <span><strong>Perfil de prueba (datos demo locales)</strong><br>{{ app.demoEmail }} · {{ app.demoPassword }}</span>
                  <button class="text-button" type="button" (click)="app.fillDemoCredentials()">Usar perfil</button>
                </div>
              }
              <div class="form-row between"><label class="check-line"><input type="checkbox" name="keep" [(ngModel)]="app.keepSession"> Mantener sesión en este equipo</label><a class="text-button" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a></div>
              <button class="primary-button full" type="submit" [disabled]="app.loginBusy">{{ app.loginBusy ? 'Entrando…' : 'Entrar' }} @if (!app.loginBusy) { <span>→</span> }</button>
            </form>
            <div class="or-divider"><span>o</span></div>
            <button class="secondary-button full" type="button" disabled title="Esta versión no incluye un proveedor de identidad corporativo."><span class="sso-icon">↗</span> SSO corporativo — no disponible en esta versión</button>
            <p class="auth-hint">¿No tienes cuenta? <button class="text-button" type="button" (click)="app.openAuth('register')">Solicitar alta de empresa</button></p>
