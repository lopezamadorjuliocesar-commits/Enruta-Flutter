name: enruta
description: EnRuta - app offline-first para repartidores y portal de negocio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  sqflite: ^2.3.3
  path: ^1.9.0
  mobile_scanner: ^7.5.0
  signature: ^6.4.0
  intl: ^0.20.3
  url_launcher: ^6.3.0
  geolocator: ^14.1.2
  device_info_plus: ^13.3.0
  connectivity_plus: ^7.3.1
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
