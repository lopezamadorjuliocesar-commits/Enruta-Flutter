name: enruta
description: EnRuta - gestión de rutas, reparto, cobranza e inventario (conductor y negocio), offline-first con SQLite.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Material se distribuye ahora como paquete (package:flutter/material.dart
  # está deprecado desde Flutter 3.47). go_router, printing y riverpod ya lo usan.
  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0
  # Estado y navegación
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  # Persistencia local
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  # Dispositivo
  mobile_scanner: ^7.5.0
  signature: ^6.4.0
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  connectivity_plus: ^7.3.1  # 7.3.2 exige dbus ^0.8 (incompatible con geolocator_linux)
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  # Comprobantes y seguridad
  pdf: ^3.13.1
  printing: ^5.15.1
  crypto: ^3.0.8
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
